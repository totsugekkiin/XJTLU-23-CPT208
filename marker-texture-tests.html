<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AR 纹理边框 A/B 测试</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, "PingFang SC", "Microsoft YaHei", sans-serif; }
      * { box-sizing: border-box; }
      html, body { width: 100%; min-height: 100%; margin: 0; }
      body { background: #eee; overflow: hidden; }
      body.outside-black { background: #050505; }
      body.outside-checker {
        background-color: #eee;
        background-image: linear-gradient(45deg, #161616 25%, transparent 25%), linear-gradient(-45deg, #161616 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #161616 75%), linear-gradient(-45deg, transparent 75%, #161616 75%);
        background-position: 0 0, 0 32px, 32px -32px, -32px 0;
        background-size: 64px 64px;
      }
      main { width: 100vw; height: 100vh; display: grid; place-items: center; padding: 18px 18px 112px; }
      #stimulus { display: block; width: auto; height: auto; max-width: min(88vw, 780px); max-height: calc(100vh - 140px); object-fit: contain; box-shadow: 0 0 0 1px rgb(0 0 0 / 18%); }
      .panel { position: fixed; z-index: 2; left: 50%; bottom: 14px; width: min(94vw, 940px); transform: translateX(-50%); padding: 12px; border: 1px solid rgb(255 255 255 / 20%); border-radius: 16px; background: rgb(12 12 12 / 92%); box-shadow: 0 12px 44px rgb(0 0 0 / 35%); backdrop-filter: blur(12px); }
      .row { display: flex; gap: 8px; align-items: center; overflow-x: auto; }
      button { flex: 0 0 auto; min-height: 38px; padding: 0 13px; border: 1px solid #555; border-radius: 10px; color: #fff; background: #292929; font: inherit; cursor: pointer; }
      button[aria-pressed="true"] { border-color: #ffd34d; color: #1d1600; background: #ffd34d; font-weight: 800; }
      #fullscreen { margin-left: auto; }
      #description { margin: 9px 2px 0; color: #ddd; font-size: 13px; line-height: 1.45; }
      .hide-panel .panel { opacity: 0; pointer-events: none; }
    </style>
  </head>
  <body>
    <main>
      <img id="stimulus" src="/markers/changgate-window-frame.png" alt="AR 识别测试图" />
    </main>
    <section class="panel" aria-label="测试版本选择">
      <div class="row" id="test-buttons"></div>
      <p id="description"></p>
    </section>
    <script>
      const tests = [
        { name: "1 基线", src: "/markers/changgate-window-frame.png", bg: "", text: "必须能稳定识别；先用它确认距离、亮度和屏幕反光条件正常。" },
        { name: "2 外部黑底", src: "/markers/changgate-window-frame.png", bg: "outside-black", text: "只改变目标图外侧。如果仍能识别，外侧白色环境不是目标内容。" },
        { name: "3 外部棋盘", src: "/markers/changgate-window-frame.png", bg: "outside-checker", text: "在图外加入强特征干扰。如果仍稳定识别，说明外侧区域没有被编进目标。" },
        { name: "4 内部灰色", src: "/markers/tests/inside-gray.png", bg: "", text: "保留边框和内沿旁的一圈白色，只替换大块内部白区。能识别表示内部纯白主体不重要。" },
        { name: "5 内部棋盘", src: "/markers/tests/inside-checker.png", bg: "", text: "内部加入大量强特征。仍能识别表示追踪主要依靠纹理边框，且能容忍洞口后的真实场景。" },
        { name: "6 黑色到内沿", src: "/markers/tests/inside-black-to-edge.png", bg: "", text: "连白色内沿关系也一起改变。能识别说明目标不依赖内部白色；若只有此项失败，依赖的是内沿对比，仍不代表依赖大块白区。" },
        { name: "7 无边框对照", src: "/markers/tests/frame-hidden-control.png", bg: "", text: "负对照：只有白色画面、没有纹理边框。它不应被识别；若识别，需排查旧锚点未消失或误判。" },
      ];
      const image = document.querySelector("#stimulus");
      const buttons = document.querySelector("#test-buttons");
      const description = document.querySelector("#description");

      function selectTest(index) {
        const test = tests[index];
        image.src = test.src;
        document.body.className = test.bg;
        description.textContent = test.text;
        [...buttons.querySelectorAll("button[data-test]")].forEach((button, buttonIndex) => {
          button.setAttribute("aria-pressed", String(buttonIndex === index));
        });
      }

      tests.forEach((test, index) => {
        const button = document.createElement("button");
        button.type = "button";
        button.dataset.test = String(index);
        button.textContent = test.name;
        button.addEventListener("click", () => selectTest(index));
        buttons.append(button);
      });

      const fullscreen = document.createElement("button");
      fullscreen.id = "fullscreen";
      fullscreen.type = "button";
      fullscreen.textContent = "全屏";
      fullscreen.addEventListener("click", async () => {
        if (!document.fullscreenElement) await document.documentElement.requestFullscreen();
        else await document.exitFullscreen();
      });
      buttons.append(fullscreen);
      document.addEventListener("keydown", (event) => {
        const number = Number(event.key);
        if (number >= 1 && number <= tests.length) selectTest(number - 1);
        if (event.key.toLowerCase() === "h") document.body.classList.toggle("hide-panel");
      });
      selectTest(0);
    </script>
  </body>
</html>
