<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>阊门窗口标记追踪测试</title>
    <link rel="stylesheet" href="/css/marker-ar.css" />
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  </head>
  <body>
    <div class="marker-test-ui" aria-live="polite">
      <div class="marker-test-card">
        <span id="marker-status-dot" class="marker-status-dot"></span>
        <div>
          <strong id="marker-status">正在启动相机…</strong>
          <small id="marker-detail">请将四边纹样完整放入画面</small>
        </div>
      </div>
      <div class="marker-test-actions">
        <a href="/print/changgate-portal-marker-a3.pdf" download>下载A3标记</a>
        <button id="flip-depth" type="button">深度翻转</button>
      </div>
      <p class="marker-test-legend">
        <span class="legend-near">红框：近端洞口</span>
        <span class="legend-far">蓝框：40 cm远端</span>
      </p>
    </div>

    <a-scene
      embedded
      vr-mode-ui="enabled: false"
      renderer="alpha: true; antialias: true; colorManagement: true"
      mindar-image="imageTargetSrc: /markers/changgate-window-frame.mind; filterMinCF: 0.0005; filterBeta: 0.01; warmupTolerance: 3; missTolerance: 8;"
      color-space="sRGB"
      device-orientation-permission-ui="enabled: false"
    >
      <a-entity id="portal-target" mindar-image-target="targetIndex: 0">
        <a-entity id="portal-rig">
          <!-- MindAR normalizes target width (24 cm) to 1 unit. -->
          <a-box position="0 0.547 0" width="0.852" height="0.018" depth="0.012" color="#ff3b30"></a-box>
          <a-box position="0 -0.547 0" width="0.852" height="0.018" depth="0.012" color="#ff3b30"></a-box>
          <a-box position="-0.426 0 0" width="0.018" height="1.083" depth="0.012" color="#ff3b30"></a-box>
          <a-box position="0.426 0 0" width="0.018" height="1.083" depth="0.012" color="#ff3b30"></a-box>

          <!-- Far aperture, 40 cm / 24 cm = 1.667 target units behind. -->
          <a-entity class="depth-node" data-base-z="-1.667" position="0 0 -1.667">
            <a-box position="0 0.547 0" width="0.852" height="0.018" depth="0.012" color="#30d5ff"></a-box>
            <a-box position="0 -0.547 0" width="0.852" height="0.018" depth="0.012" color="#30d5ff"></a-box>
            <a-box position="-0.426 0 0" width="0.018" height="1.083" depth="0.012" color="#30d5ff"></a-box>
            <a-box position="0.426 0 0" width="0.018" height="1.083" depth="0.012" color="#30d5ff"></a-box>
          </a-entity>

          <a-box class="depth-guide" data-base-z="-0.8335" position="-0.417 0.542 -0.8335" width="0.012" height="0.012" depth="1.667" color="#ffd54a"></a-box>
          <a-box class="depth-guide" data-base-z="-0.8335" position="0.417 0.542 -0.8335" width="0.012" height="0.012" depth="1.667" color="#ffd54a"></a-box>
          <a-box class="depth-guide" data-base-z="-0.8335" position="-0.417 -0.542 -0.8335" width="0.012" height="0.012" depth="1.667" color="#ffd54a"></a-box>
          <a-box class="depth-guide" data-base-z="-0.8335" position="0.417 -0.542 -0.8335" width="0.012" height="0.012" depth="1.667" color="#ffd54a"></a-box>
        </a-entity>
      </a-entity>
      <a-entity camera></a-entity>
    </a-scene>

    <script type="module" src="/js/ar/markerPortalTest.js"></script>
  </body>
</html>
