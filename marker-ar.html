<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>阊门窗口标记追踪测试</title>
    <link rel="stylesheet" href="/css/marker-ar.css" />
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="/vendor/mindar/mindar-image-aframe-field.prod.js?v=20260726-2"></script>
  </head>
  <body>
    <div id="camera-gate" class="camera-gate">
      <div class="camera-gate-card">
        <strong>启动窗口 AR 测试</strong>
        <p id="camera-gate-detail">点击后浏览器会申请使用后置摄像头。</p>
        <button id="start-camera" type="button">允许并打开摄像头</button>
      </div>
    </div>

    <div id="marker-scan-guide" class="marker-scan-guide" aria-hidden="true">
      <span>后退一点，让纹样外框接近此大小</span>
    </div>

    <div class="marker-test-ui" aria-live="polite">
      <div class="marker-test-card">
        <span id="marker-status-dot" class="marker-status-dot"></span>
        <div>
          <strong id="marker-status">正在启动相机…</strong>
          <small id="marker-detail">请将四边纹样完整放入画面</small>
        </div>
      </div>
      <div class="marker-test-actions">
        <a href="/print/changgate-portal-marker-border-only-a3.pdf" download>下载A3标记</a>
        <a href="/portal-model-editor.html">调整取景</a>
        <button id="toggle-occlusion" type="button" aria-pressed="true">遮挡：开</button>
        <button id="toggle-perspective" type="button" aria-pressed="true">透视：物理</button>
        <button id="calibrate-distance" type="button" disabled>以当前距离校准</button>
        <button id="flip-depth" type="button">深度翻转</button>
      </div>
      <p class="marker-test-legend">
        <span class="legend-near">红框：近端洞口</span>
        <span class="legend-far">蓝框：40 cm远端</span>
        <span class="legend-mask">场景只在蓝框内显示，红蓝之间保持透明</span>
      </p>
    </div>

    <a-scene
      embedded
      vr-mode-ui="enabled: false"
      renderer="alpha: true; antialias: true; colorManagement: true"
      mindar-image="imageTargetSrc: /markers/changgate-window-frame-border-only.mind; autoStart: false; uiLoading: no; uiScanning: no; uiError: no; filterMinCF: 0.0005; filterBeta: 0.01; warmupTolerance: 1; missTolerance: 20;"
      color-space="sRGB"
      device-orientation-permission-ui="enabled: false"
    >
      <a-entity id="portal-target" mindar-image-target="targetIndex: 0"></a-entity>
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
    </a-scene>

    <script type="module" src="/js/ar/markerPortalTest.js"></script>
  </body>
</html>
