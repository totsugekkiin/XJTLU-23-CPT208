<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>阊门</title>
  <link rel="stylesheet" href="css/appmain.css">
</head>
<body>

<section class="hero" id="hero">
  <div class="hero-topbar">
    <span class="hero-logo">changmen</span>
    <span class="hero-pill">互动导览</span>
  </div>
  <article class="hero-copy hero-card" id="hero-card" data-component="hero-card">
    <div class="hero-card-stack" id="hero-card-stack">
      <section class="stack-card stack-card--primary" data-card-index="0">
        <h1 class="hero-card__title">阊门</h1>
        <p class="hero-card__description">从城门到水巷，开启一段卡通扁平风格的古城探索。</p>
        <div class="hero-card__actions">
          <button class="btn hero-card__cta" id="hero-go-btn" type="button">GO</button>
        </div>
        <div class="hero-scroll-hint hero-card__scroll-hint" aria-hidden="true">
          <span class="hint-stem hero-card__hint-stem"></span>
          <span class="hint-head hero-card__hint-head"></span>
        </div>
      </section>

      <section class="stack-card stack-card--blue" data-card-index="1">
        <div class="stack-card__head">
          <h2 class="hero-card__title hero-card__title--sub">历史渊源</h2>
        </div>
        <div class="stack-card__stage">
          <svg class="stack-card__svg svg-motif svg-motif--star" viewBox="0 0 220 160" aria-hidden="true" role="img">
            <circle class="motif-core" cx="110" cy="78" r="28"></circle>
            <polygon class="motif-star motif-spin" points="110,28 121,60 155,60 127,80 138,112 110,92 82,112 93,80 65,60 99,60"></polygon>
            <circle class="motif-dot motif-float motif-delay-1" cx="52" cy="42" r="7"></circle>
            <circle class="motif-dot motif-float motif-delay-2" cx="176" cy="56" r="5"></circle>
            <circle class="motif-dot motif-float motif-delay-3" cx="70" cy="120" r="6"></circle>
            <path class="motif-orbit" d="M42 94C70 124 150 124 178 94"></path>
          </svg>
        </div>
        <div class="stack-card__foot">
          <p class="hero-card__description">作为苏州古城八大城门之一，阊门始建于春秋阖闾时期，见证了苏州两千五百多年的岁月变迁。</p>
        </div>
      </section>

      <section class="stack-card stack-card--cream" data-card-index="2">
        <div class="stack-card__head">
          <h2 class="hero-card__title hero-card__title--sub">铜钱流转</h2>
        </div>
        <div class="stack-card__stage">
          <svg class="stack-card__svg svg-motif svg-motif--coin" viewBox="0 0 220 160" aria-hidden="true" role="img">
            <g class="motif-coin">
              <circle class="motif-coin-outer" cx="110" cy="82" r="44"></circle>
              <circle class="motif-coin-inner-ring" cx="110" cy="82" r="33"></circle>
              <rect class="motif-coin-hole" x="95" y="67" width="30" height="30" rx="3"></rect>
              <path class="motif-coin-glyph motif-coin-glyph--top" d="M110 44L116 52L110 60L104 52Z"></path>
              <path class="motif-coin-glyph motif-coin-glyph--right" d="M148 82L140 88L132 82L140 76Z"></path>
              <path class="motif-coin-glyph motif-coin-glyph--bottom" d="M110 120L116 112L110 104L104 112Z"></path>
              <path class="motif-coin-glyph motif-coin-glyph--left" d="M72 82L80 88L88 82L80 76Z"></path>
            </g>
          </svg>
        </div>
        <div class="stack-card__foot">
          <p class="hero-card__description">占位文案：古代铜钱旋转流动，映照商贸与市井繁华。</p>
        </div>
      </section>

      <section class="stack-card stack-card--green" data-card-index="3">
        <div class="stack-card__head">
          <h2 class="hero-card__title hero-card__title--sub">灵感点亮</h2>
        </div>
        <div class="stack-card__stage">
          <svg class="stack-card__svg svg-motif svg-motif--bulb" viewBox="0 0 220 160" aria-hidden="true" role="img">
            <g class="motif-float motif-bulb">
              <path class="motif-glass" d="M110 30C80 30 62 54 62 80C62 100 74 114 90 122H130C146 114 158 100 158 80C158 54 140 30 110 30Z"></path>
              <path class="motif-glow motif-pulse" d="M110 42C89 42 76 58 76 79C76 96 86 107 98 112H122C134 107 144 96 144 79C144 58 131 42 110 42Z"></path>
              <rect class="motif-base" x="92" y="122" width="36" height="20" rx="8"></rect>
            </g>
            <line class="motif-ray motif-delay-1" x1="110" y1="12" x2="110" y2="0"></line>
            <line class="motif-ray motif-delay-2" x1="72" y1="28" x2="62" y2="18"></line>
            <line class="motif-ray motif-delay-3" x1="148" y1="28" x2="158" y2="18"></line>
            <line class="motif-ray motif-delay-1" x1="58" y1="80" x2="44" y2="80"></line>
            <line class="motif-ray motif-delay-2" x1="162" y1="80" x2="176" y2="80"></line>
          </svg>
        </div>
        <div class="stack-card__foot">
          <p class="hero-card__description">占位文案：替换为你想展示的简短说明。</p>
        </div>
      </section>

      <section class="stack-card stack-card--indigo" data-card-index="4">
        <div class="stack-card__head">
          <h2 class="hero-card__title hero-card__title--sub">齿轮同频</h2>
        </div>
        <div class="stack-card__stage">
          <svg class="stack-card__svg svg-motif svg-motif--gear" viewBox="0 0 220 160" aria-hidden="true" role="img">
            <g class="motif-gear-group motif-spin">
              <circle class="motif-gear-ring" cx="110" cy="82" r="34"></circle>
              <circle class="motif-gear-hole" cx="110" cy="82" r="14"></circle>
              <rect class="motif-tooth" x="106" y="34" width="8" height="16" rx="3"></rect>
              <rect class="motif-tooth" x="106" y="114" width="8" height="16" rx="3"></rect>
              <rect class="motif-tooth" x="150" y="78" width="16" height="8" rx="3"></rect>
              <rect class="motif-tooth" x="54" y="78" width="16" height="8" rx="3"></rect>
              <rect class="motif-tooth" x="138" y="46" width="8" height="16" rx="3" transform="rotate(45 142 54)"></rect>
              <rect class="motif-tooth" x="74" y="102" width="8" height="16" rx="3" transform="rotate(45 78 110)"></rect>
              <rect class="motif-tooth" x="74" y="46" width="8" height="16" rx="3" transform="rotate(-45 78 54)"></rect>
              <rect class="motif-tooth" x="138" y="102" width="8" height="16" rx="3" transform="rotate(-45 142 110)"></rect>
            </g>
            <circle class="motif-dot motif-float motif-delay-1" cx="58" cy="48" r="5"></circle>
            <circle class="motif-dot motif-float motif-delay-2" cx="166" cy="116" r="6"></circle>
          </svg>
        </div>
        <div class="stack-card__foot">
          <p class="hero-card__description">占位文案：替换为你想展示的简短说明。</p>
        </div>
      </section>
    </div>
  </article>
</section>

<section class="target-zone-wrap" aria-label="桌宠目标感应区">
  <div id="target-zone" class="target-zone" data-component="target-zone">
    <span class="target-zone__eyebrow">TARGET</span>
    <h2 class="target-zone__title">固定界面区域</h2>
    <p class="target-zone__desc">滚动至此，桌宠会自动移动到这里来打个招呼。</p>
  </div>
</section>

<div id="pet-layer" class="pet-layer" aria-hidden="true">
  <div id="pet-hitzone" class="pet-hitzone" role="button" aria-label="可拖拽的桌面宠物" tabindex="-1"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pixi.js@8/dist/pixi.min.js"></script>
<script type="module" src="js/appmain.js"></script>
</body>
</html>
