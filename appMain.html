<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>阊门</title>
  <link rel="stylesheet" href="css/appmain.css">
</head>
<body>

<section class="hero" id="hero">
  <div class="cloud-field" aria-hidden="true">
    <span class="cloud cloud--a" style="--cx: 4%;  --cy: 3%;  --cs: 1.05; --co: 0.95; --cd: -0.2s;"></span>
    <span class="cloud cloud--b" style="--cx: 74%; --cy: 6%;  --cs: 0.78; --co: 0.88; --cd: -2.4s;"></span>
    <span class="cloud cloud--c" style="--cx: 38%; --cy: 12%; --cs: 0.6;  --co: 0.72; --cd: -4.7s;"></span>
    <span class="cloud cloud--a" style="--cx: 62%; --cy: 19%; --cs: 1.15; --co: 0.92; --cd: -1.1s;"></span>
    <span class="cloud cloud--b" style="--cx: 8%;  --cy: 27%; --cs: 0.88; --co: 0.9;  --cd: -3.8s;"></span>
    <span class="cloud cloud--c" style="--cx: 84%; --cy: 33%; --cs: 0.72; --co: 0.8;  --cd: -5.6s;"></span>
    <span class="cloud cloud--a" style="--cx: 26%; --cy: 41%; --cs: 0.95; --co: 0.9;  --cd: -0.8s;"></span>
    <span class="cloud cloud--b" style="--cx: 68%; --cy: 47%; --cs: 0.68; --co: 0.78; --cd: -6.3s;"></span>
    <span class="cloud cloud--c" style="--cx: 12%; --cy: 55%; --cs: 1.1;  --co: 0.93; --cd: -2.0s;"></span>
    <span class="cloud cloud--a" style="--cx: 56%; --cy: 62%; --cs: 0.82; --co: 0.86; --cd: -4.1s;"></span>
    <span class="cloud cloud--b" style="--cx: 82%; --cy: 69%; --cs: 0.95; --co: 0.9;  --cd: -1.7s;"></span>
    <span class="cloud cloud--c" style="--cx: 20%; --cy: 76%; --cs: 0.7;  --co: 0.78; --cd: -5.2s;"></span>
    <span class="cloud cloud--a" style="--cx: 64%; --cy: 83%; --cs: 1.0;  --co: 0.92; --cd: -3.0s;"></span>
    <span class="cloud cloud--b" style="--cx: 10%; --cy: 90%; --cs: 0.78; --co: 0.85; --cd: -0.5s;"></span>
    <span class="cloud cloud--c" style="--cx: 78%; --cy: 95%; --cs: 0.9;  --co: 0.9;  --cd: -4.4s;"></span>
  </div>
  <div class="hero-topbar">
    <span class="hero-logo">changmen</span>
    <span class="hero-pill">互动导览</span>
  </div>
  <article class="hero-copy hero-card" id="hero-card" data-component="hero-card">
    <div class="hero-card-stack" id="hero-card-stack">
      <section class="stack-card stack-card--primary" data-card-index="0">
        <h1 class="hero-card__title">阊门</h1>
        <p class="hero-card__description">从城门到水巷，开启一段的古城探索。</p>
        <div class="hero-card__actions">
          <button class="btn hero-card__cta" id="hero-go-btn" type="button">GO</button>
        </div>
        <div class="hero-scroll-hint hero-card__scroll-hint" aria-hidden="true">
          <span class="hint-stem hero-card__hint-stem"></span>
          <span class="hint-head hero-card__hint-head"></span>
        </div>
      </section>

      <section class="stack-card stack-card--blue" data-card-index="1">
        <div class="stack-card__head">
          <h2 class="hero-card__title hero-card__title--sub">历史渊源</h2>
        </div>
        <div class="stack-card__stage">
          <svg class="stack-card__svg svg-motif svg-motif--star" viewBox="0 0 220 160" aria-hidden="true" role="img">
            <circle class="motif-core" cx="110" cy="78" r="28"></circle>
            <polygon class="motif-star motif-spin" points="110,28 121,60 155,60 127,80 138,112 110,92 82,112 93,80 65,60 99,60"></polygon>
            <circle class="motif-dot motif-float motif-delay-1" cx="52" cy="42" r="7"></circle>
            <circle class="motif-dot motif-float motif-delay-2" cx="176" cy="56" r="5"></circle>
            <circle class="motif-dot motif-float motif-delay-3" cx="70" cy="120" r="6"></circle>
            <path class="motif-orbit" d="M42 94C70 124 150 124 178 94"></path>
          </svg>
        </div>
        <div class="stack-card__foot">
          <p class="hero-card__description">作为苏州古城八大城门之一，阊门始建于春秋阖闾时期，见证了苏州两千五百多年的岁月变迁。</p>
        </div>
      </section>

      <section class="stack-card stack-card--cream" data-card-index="2">
        <div class="stack-card__head">
          <h2 class="hero-card__title hero-card__title--sub">商业鼎盛</h2>
        </div>
        <div class="stack-card__stage">
          <svg class="stack-card__svg svg-motif svg-motif--coin" viewBox="0 0 220 160" aria-hidden="true" role="img">
            <g class="motif-coin">
              <circle class="motif-coin-outer" cx="110" cy="82" r="44"></circle>
              <circle class="motif-coin-inner-ring" cx="110" cy="82" r="33"></circle>
              <rect class="motif-coin-hole" x="95" y="67" width="30" height="30" rx="3"></rect>
              <path class="motif-coin-glyph motif-coin-glyph--top" d="M110 44L116 52L110 60L104 52Z"></path>
              <path class="motif-coin-glyph motif-coin-glyph--right" d="M148 82L140 88L132 82L140 76Z"></path>
              <path class="motif-coin-glyph motif-coin-glyph--bottom" d="M110 120L116 112L110 104L104 112Z"></path>
              <path class="motif-coin-glyph motif-coin-glyph--left" d="M72 82L80 88L88 82L80 76Z"></path>
            </g>
          </svg>
        </div>
        <div class="stack-card__foot">
          <p class="hero-card__description">明清时期这里曾是全国水陆交通枢纽与顶级商业中心，历史上繁华程度被誉为天下财富聚集之所</p>
        </div>
      </section>

      <section class="stack-card stack-card--green" data-card-index="3">
        <div class="stack-card__head">
          <h2 class="hero-card__title hero-card__title--sub">文化地标</h2>
        </div>
        <div class="stack-card__stage">
          <svg class="stack-card__svg svg-motif svg-motif--lotus" viewBox="0 0 220 160" aria-hidden="true" role="img">
            <ellipse class="lotus-water lotus-water--1" cx="110" cy="130" rx="74" ry="6"></ellipse>
            <ellipse class="lotus-water lotus-water--2" cx="110" cy="140" rx="48" ry="4"></ellipse>
            <ellipse class="lotus-pad" cx="110" cy="120" rx="62" ry="10"></ellipse>
            <g class="lotus">
              <g transform="rotate(-82 110 110)"><path class="petal petal--outer petal--o1" d="M110 110 C84 88 84 54 110 32 C136 54 136 88 110 110 Z"></path></g>
              <g transform="rotate(-42 110 110)"><path class="petal petal--outer petal--o2" d="M110 110 C84 88 84 54 110 32 C136 54 136 88 110 110 Z"></path></g>
              <g transform="rotate(0 110 110)"><path class="petal petal--outer petal--o3" d="M110 110 C84 88 84 54 110 32 C136 54 136 88 110 110 Z"></path></g>
              <g transform="rotate(42 110 110)"><path class="petal petal--outer petal--o2" d="M110 110 C84 88 84 54 110 32 C136 54 136 88 110 110 Z"></path></g>
              <g transform="rotate(82 110 110)"><path class="petal petal--outer petal--o1" d="M110 110 C84 88 84 54 110 32 C136 54 136 88 110 110 Z"></path></g>

              <g transform="rotate(-48 110 110)"><path class="petal petal--mid petal--m1" d="M110 110 C94 96 94 68 110 50 C126 68 126 96 110 110 Z"></path></g>
              <g transform="rotate(-16 110 110)"><path class="petal petal--mid petal--m2" d="M110 110 C94 96 94 68 110 50 C126 68 126 96 110 110 Z"></path></g>
              <g transform="rotate(16 110 110)"><path class="petal petal--mid petal--m2" d="M110 110 C94 96 94 68 110 50 C126 68 126 96 110 110 Z"></path></g>
              <g transform="rotate(48 110 110)"><path class="petal petal--mid petal--m1" d="M110 110 C94 96 94 68 110 50 C126 68 126 96 110 110 Z"></path></g>

              <g transform="rotate(-22 110 110)"><path class="petal petal--inner petal--i1" d="M110 110 C100 100 100 82 110 70 C120 82 120 100 110 110 Z"></path></g>
              <g transform="rotate(22 110 110)"><path class="petal petal--inner petal--i1" d="M110 110 C100 100 100 82 110 70 C120 82 120 100 110 110 Z"></path></g>
              <path class="petal petal--inner petal--i2" d="M110 110 C102 102 102 88 110 78 C118 88 118 102 110 110 Z"></path>

              <circle class="lotus-core" cx="110" cy="98" r="5"></circle>
            </g>
          </svg>
        </div>
        <div class="stack-card__foot">
          <p class="hero-card__description">占位文案：替换为你想展示的简短说明。</p>
        </div>
      </section>

      <section class="stack-card stack-card--indigo" data-card-index="4">
        <div class="stack-card__head">
          <h2 class="hero-card__title hero-card__title--sub">齿轮同频</h2>
        </div>
        <div class="stack-card__stage">
          <svg class="stack-card__svg svg-motif svg-motif--gear" viewBox="0 0 220 160" aria-hidden="true" role="img">
            <g class="motif-gear-group motif-spin">
              <circle class="motif-gear-ring" cx="110" cy="82" r="34"></circle>
              <circle class="motif-gear-hole" cx="110" cy="82" r="14"></circle>
              <rect class="motif-tooth" x="106" y="34" width="8" height="16" rx="3"></rect>
              <rect class="motif-tooth" x="106" y="114" width="8" height="16" rx="3"></rect>
              <rect class="motif-tooth" x="150" y="78" width="16" height="8" rx="3"></rect>
              <rect class="motif-tooth" x="54" y="78" width="16" height="8" rx="3"></rect>
              <rect class="motif-tooth" x="138" y="46" width="8" height="16" rx="3" transform="rotate(45 142 54)"></rect>
              <rect class="motif-tooth" x="74" y="102" width="8" height="16" rx="3" transform="rotate(45 78 110)"></rect>
              <rect class="motif-tooth" x="74" y="46" width="8" height="16" rx="3" transform="rotate(-45 78 54)"></rect>
              <rect class="motif-tooth" x="138" y="102" width="8" height="16" rx="3" transform="rotate(-45 142 110)"></rect>
            </g>
            <circle class="motif-dot motif-float motif-delay-1" cx="58" cy="48" r="5"></circle>
            <circle class="motif-dot motif-float motif-delay-2" cx="166" cy="116" r="6"></circle>
          </svg>
        </div>
        <div class="stack-card__foot">
          <p class="hero-card__description">占位文案：替换为你想展示的简短说明。</p>
        </div>
      </section>
    </div>
  </article>
</section>

<section class="cm-mask-transition" id="cm-transition" aria-label="阊门挖洞转场">
  <div class="cm-mask-transition__scroll" id="cm-mask-scroll">
    <div class="cm-mask-transition__sticky">
      <div class="cm-mask-bottom" aria-hidden="true">
        <h2 class="cm-mask-bottom__title">阊门</h2>
      </div>

      <div class="cm-mask-top" id="maskLayer" aria-hidden="true">
        <svg viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid slice">
          <defs>
            <pattern id="cmGridPattern" width="64" height="64" patternUnits="userSpaceOnUse">
              <rect width="64" height="64" fill="#e31221"></rect>
              <path d="M 64 0 L 0 0 0 64" fill="none" stroke="#600000" stroke-width="1.5"></path>
            </pattern>

            <mask id="cmHoleMask">
              <rect width="100%" height="100%" fill="white"></rect>
              <rect x="396" y="190" width="208" height="620" rx="104" fill="black"></rect>
            </mask>
          </defs>

          <rect width="1000" height="1000" fill="url(#cmGridPattern)" mask="url(#cmHoleMask)"></rect>
          <rect x="384" y="178" width="232" height="644" rx="116" fill="none" stroke="#e31221" stroke-width="24"></rect>
          <rect x="372" y="166" width="256" height="668" rx="128" fill="none" stroke="#000000" stroke-width="1"></rect>
          <rect x="396" y="190" width="208" height="620" rx="104" fill="none" stroke="#000000" stroke-width="1"></rect>
        </svg>
      </div>
    </div>
  </div>
</section>

<div id="pet-layer" class="pet-layer" aria-hidden="true">
  <div id="pet-hitzone" class="pet-hitzone" role="button" aria-label="可拖拽的桌面宠物" tabindex="-1"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pixi.js@8/dist/pixi.min.js"></script>
<script type="module" src="js/appmain.js"></script>
</body>
</html>
